<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Book Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🖼️ My Visual Library</h1>
        <div class="controls-grid">
            <div class="add-form">
                <input type="text" id="book-title" placeholder="Title">
                <input type="text" id="book-url" placeholder="URL (https://...)">
                <button onclick="addNewBook()">+ Add Book</button>
            </div>
            <input type="text" id="search-input" placeholder="🔍 Search library..." oninput="renderBooks()">
        </div>
    </header>

    <div class="stats-bar">
        <div><b id="total-books">0</b> Books</div>
        <div><b id="finished-books">0</b> Finished</div>
    </div>

    <main id="bookshelf" class="cover-grid">
        <!-- Book covers appear here -->
    </main>

    <!-- Reader Overlay -->
    <div id="reader-overlay" class="overlay hidden">
        <div class="reader-header">
            <button onclick="closeReader()">✕ Close</button>
            <span id="current-book-title"></span>
            <div class="progress-edit">
                 Progress: <input type="number" id="reader-progress" min="0" max="100">%
            </div>
        </div>
        <iframe id="book-frame" src=""></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
